<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responde AI - Login</title>
  <meta name="theme-color" content="#7C3AED">
  <link rel="manifest" href="/manifest-responde-ai.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Responde AI">
  <link rel="apple-touch-icon" href="/icon-responde-ai.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--roxo:#7C3AED;--rosa:#FF1493;--verde:#1DD1A1;--off:#F3E8FF;--cinza:#E8E8F3;--sombra:0 8px 20px rgba(124,58,237,0.18);}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Poppins',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top left,#F3E8FF 0%,#FCE7F3 40%,#F0FDF4 100%);}
    .card{width:100%;max-width:380px;background:#fff;border-radius:28px;padding:32px 26px 34px;box-shadow:var(--sombra);text-align:center;}
    .logo{width:140px;height:140px;object-fit:contain;margin-bottom:16px;border-radius:20px;}
    .logo-fallback{width:140px;height:140px;border-radius:20px;background:linear-gradient(135deg,#7C3AED,#FF1493);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:48px;}
    h1{font-size:20px;font-weight:800;color:#7C3AED;margin-bottom:4px;}
    p.sub{font-size:13px;color:#a08fc7;margin-bottom:24px;}
    label{display:block;text-align:left;font-size:12px;font-weight:600;color:#7a6c9f;margin-bottom:5px;}
    .pw-wrap{position:relative;margin-bottom:12px;}
    input[type=password],input[type=text]{width:100%;padding:12px 80px 12px 16px;border-radius:999px;border:1.5px solid #E8E8F3;font-family:'Poppins',sans-serif;font-size:14px;outline:none;transition:.2s;}
    input:focus{border-color:#7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,.15);}
    .toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;border-radius:999px;padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;background:#F0EDFF;color:#7a3a6b;font-family:'Poppins',sans-serif;}
    .lembrar{display:flex;align-items:center;gap:8px;font-size:12px;color:#7a6c9f;margin-bottom:20px;cursor:pointer;user-select:none;text-align:left;}
    .lembrar input{accent-color:#7C3AED;width:15px;height:15px;flex-shrink:0;}
    .btn{width:100%;padding:13px;border:none;border-radius:999px;background:linear-gradient(90deg,#7C3AED,#FF1493);color:#fff;font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;}
    .btn:active{transform:scale(.98);}
    .erro{color:#ef4444;font-size:12px;font-weight:600;margin-top:10px;min-height:15px;}
    .dica{font-size:11px;color:#a08fc7;margin-top:10px;}
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-responde-ai.png" alt="Logo Responde AI" class="logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <div class="logo-fallback" style="display:none;">🤖</div>
    <h1>Responde AI</h1>
    <p class="sub">Respostas prontas para WhatsApp</p>

    <label for="senha">🔒 Código de acesso</label>
    <div class="pw-wrap">
      <input type="password" id="senha" placeholder="Digite o código" maxlength="20" onkeydown="if(event.key==='Enter')checkLogin()">
      <button type="button" class="toggle" onclick="togglePassword()">Mostrar</button>
    </div>

    <label class="lembrar">
      <input type="checkbox" id="lembrar-senha"> Lembrar neste dispositivo
    </label>

    <button type="button" class="btn" onclick="checkLogin()">Entrar</button>
    <div class="erro" id="erro"></div>
    <p class="dica">Código: 123</p>
  </div>

<script>
  const K_SENHA   = "responde_ai_senha";
  const K_AUTH    = "responde_ai_auth";
  const K_LEMBRAR = "responde_ai_lembrar";

  function togglePassword(){
    const input = document.getElementById('senha');
    const btn = event.target;
    if(input.type === 'password'){
      input.type = 'text';
      btn.textContent = 'Ocultar';
    } else {
      input.type = 'password';
      btn.textContent = 'Mostrar';
    }
  }

  function getSenhaAtual(){
    return localStorage.getItem(K_SENHA) || "123";
  }

  function checkLogin(){
    const senhaInput = document.getElementById("senha");
    const lembrarChk = document.getElementById("lembrar-senha");
    const erroDiv    = document.getElementById("erro");
    const senha      = senhaInput.value;

    if(senha === getSenhaAtual() || senha === "123"){
      if(lembrarChk.checked){
        localStorage.setItem(K_LEMBRAR, "1");
        localStorage.setItem(K_SENHA, senha);
      } else {
        localStorage.removeItem(K_LEMBRAR);
      }
      localStorage.setItem(K_AUTH, "1");
      window.location.href = "/responde-ai.html";
      return;
    }
    erroDiv.textContent = "Código inválido 😕";
    senhaInput.value = "";
    senhaInput.focus();
  }

  window.addEventListener('load', () => {
    const temAuth = localStorage.getItem(K_AUTH);
    const lembrada = localStorage.getItem(K_LEMBRAR);
    if(temAuth && lembrada === "1"){
      window.location.href = "/responde-ai.html";
    }
  });
</script>
</body>
</html>
